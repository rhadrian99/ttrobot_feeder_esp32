[env:esp32-wroom]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 460800
extra_scripts = post:copy_firmware.py
lib_deps =
  gin66/FastAccelStepper@^0.30.0

